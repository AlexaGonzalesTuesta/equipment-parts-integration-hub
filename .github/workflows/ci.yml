name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the end-to-end pipeline
        run: python run_pipeline.py
      - name: Run all tests (unit, integration, non-functional, system)
        run: pytest --junitxml=reports/junit.xml
      - name: Build requirements traceability matrix (fails if a Must-have requirement is untested)
        run: python tools/build_rtm.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            reports/
            docs/05_requirements_traceability.md
            docs/requirements_traceability.csv
            data/run_summary.json
