name: Publish console

# Runs the 90-day simulation, sends every demo scenario through the real hub, and publishes
# the recorded results as a static page on GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the 90-day simulation
        run: python run_pipeline.py
      - name: Run the tests and rebuild the traceability matrix shown on the page
        run: |
          pytest -q
          python tools/build_rtm.py
      - name: Record the demo scenarios and build the page
        run: python site/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
